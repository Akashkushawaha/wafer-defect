[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wafer-defect"
version = "0.1.0"
description = "Wafer-map defect pattern classification on WM-811K with physics-motivated features"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Akash Kushawaha" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
wafer = "waferdefect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
